name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

# Serialize releases: a later tag must not race an in-flight publish and win
# the `latest` tag. Never cancel a publish mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_GHCR: ghcr.io/linagora/twake-directory-manager
  IMAGE_DOCKER: docker.io/yadd/twake-directory-manager

jobs:
  # Gate the whole release on a green build + test suite: nothing is published
  # if the console does not build.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Build and push the amd64 image (fast, runs first).
  docker-amd64:
    name: Build & Push Docker (amd64)
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_GHCR }}
            ${{ env.IMAGE_DOCKER }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_GHCR }}:${{ steps.version.outputs.version }}-amd64
            ${{ env.IMAGE_DOCKER }}:${{ steps.version.outputs.version }}-amd64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build the arm64 image (slower: the base image is emulated).
  docker-arm64:
    name: Build & Push Docker (arm64)
    runs-on: ubuntu-latest
    needs: docker-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_GHCR }}:${{ needs.docker-amd64.outputs.version }}-arm64
            ${{ env.IMAGE_DOCKER }}:${{ needs.docker-amd64.outputs.version }}-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Assemble the multi-arch manifests once both arch builds are pushed.
  docker-manifest:
    name: Create Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: [docker-amd64, docker-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          VERSION: ${{ needs.docker-amd64.outputs.version }}
        run: |
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          for IMAGE in "$IMAGE_GHCR" "$IMAGE_DOCKER"; do
            for TAG in "$VERSION" "$MAJOR_MINOR" "$MAJOR" "latest"; do
              docker buildx imagetools create -t "${IMAGE}:${TAG}" \
                "${IMAGE}:${VERSION}-amd64" \
                "${IMAGE}:${VERSION}-arm64"
            done
          done

  # Package the chart under the tag's version and push it as an OCI artifact.
  helm:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: docker-manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Set chart version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/^version:.*/version: $VERSION/" helm/twake-directory-manager/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" helm/twake-directory-manager/Chart.yaml
          cat helm/twake-directory-manager/Chart.yaml

      - name: Package chart
        run: helm package helm/twake-directory-manager --destination .

      - name: Login to GHCR (Helm registry)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY_GHCR }} --username ${{ github.actor }} --password-stdin

      - name: Push chart to OCI registry
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          helm push "twake-directory-manager-${VERSION}.tgz" oci://${{ env.REGISTRY_GHCR }}/linagora/charts

  release:
    name: Create GitHub Release
    needs: [docker-manifest, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## v/ {
              if (inSection) exit
              hdr = "## v" ver
              if (substr($0,1,length(hdr))==hdr && (length($0)==length(hdr) || substr($0,length(hdr)+1,1)==" ")) { inSection=1; next }
            }
            inSection { print }
          ' CHANGELOG.md > release-notes.md
          # Fall back to a link if the version has no CHANGELOG entry.
          if [ ! -s release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)." > release-notes.md
          fi
          echo "----- release notes -----"; cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
