name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

# Serialize releases: a later tag must not race an in-flight publish and win
# the `latest` tag. Never cancel a publish mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_GHCR: ghcr.io/linagora/twake-directory-manager
  IMAGE_DOCKER: docker.io/yadd/twake-directory-manager

jobs:
  # Gate the whole release on a green build + test suite: nothing is published
  # if the console does not build.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # The end to end suite gates the release too: the Playwright suite of e2e/ against the image
  # built from this tree, behind the stack of scripts/qa-environment/ (OpenLDAP + Dex).
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build the image
        run: ../scripts/qa-environment/build.sh

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: ./scripts/start.sh

      - name: Test
        run: npx playwright test

      - name: Logs of the stack
        if: failure()
        run: mkdir -p test-results && docker compose -p twake-directory-manager-e2e -f ../scripts/qa-environment/docker-compose.yaml logs --no-color > test-results/stack.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: ./scripts/stop.sh

  # Build and push one image per architecture, in parallel, each on a native
  # runner: no QEMU emulation for arm64.
  docker:
    name: Build & Push Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [test, e2e]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_GHCR }}
            ${{ env.IMAGE_DOCKER }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # One cache scope per architecture: the parallel builds must not
      # overwrite each other's cache.
      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ env.IMAGE_GHCR }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ${{ env.IMAGE_DOCKER }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  # Assemble the multi-arch manifests once both arch builds are pushed.
  docker-manifest:
    name: Create Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One manifest per registry carrying all its tags, both registries at
      # once. Each push is awaited on its own: a bare `wait` would hide a
      # failure.
      - name: Create and push multi-arch manifests
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          PIDS=()
          for IMAGE in "$IMAGE_GHCR" "$IMAGE_DOCKER"; do
            TAGS=()
            for TAG in "$VERSION" "$MAJOR_MINOR" "$MAJOR" "latest"; do
              TAGS+=(-t "${IMAGE}:${TAG}")
            done
            docker buildx imagetools create "${TAGS[@]}" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64" &
            PIDS+=($!)
          done
          for PID in "${PIDS[@]}"; do
            wait "$PID"
          done

  # Package the chart under the tag's version and push it as an OCI artifact.
  helm:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: docker-manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Set chart version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/^version:.*/version: $VERSION/" helm/twake-directory-manager/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" helm/twake-directory-manager/Chart.yaml
          cat helm/twake-directory-manager/Chart.yaml

      - name: Package chart
        run: helm package helm/twake-directory-manager --destination .

      - name: Login to GHCR (Helm registry)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY_GHCR }} --username ${{ github.actor }} --password-stdin

      - name: Push chart to OCI registry
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          helm push "twake-directory-manager-${VERSION}.tgz" oci://${{ env.REGISTRY_GHCR }}/linagora/charts

  release:
    name: Create GitHub Release
    needs: [docker-manifest, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## v/ {
              if (inSection) exit
              hdr = "## v" ver
              if (substr($0,1,length(hdr))==hdr && (length($0)==length(hdr) || substr($0,length(hdr)+1,1)==" ")) { inSection=1; next }
            }
            inSection { print }
          ' CHANGELOG.md > release-notes.md
          # Fall back to a link if the version has no CHANGELOG entry.
          if [ ! -s release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)." > release-notes.md
          fi
          echo "----- release notes -----"; cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
