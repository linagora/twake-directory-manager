name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

# Serialize releases: a later tag must not race an in-flight publish and win
# the `latest` tag. Never cancel a publish mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_GHCR: ghcr.io/linagora/twake-directory-manager
  IMAGE_DOCKER: docker.io/yadd/twake-directory-manager

jobs:
  # Every gate a pull request runs, from the one workflow that defines them:
  # lint, format, typecheck, unit tests on each Node version, build, the end
  # to end suite against the image built from this tree, and the Helm checks.
  # Nothing is published if any of them fails.
  checks:
    name: Checks
    uses: ./.github/workflows/test.yml

  # The tag, package.json, the chart and the changelog have to agree before
  # anything is published under the tag's version: the version in
  # package.json has lagged behind a tag before, and a tag without its
  # changelog section would have made a release note out of a link.
  preflight:
    name: Version, chart and changelog agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare the tag with package.json, Chart.yaml and CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE=$(node -p "require('./package.json').version")
          CHART=$(sed -n 's/^version: *//p' helm/twake-directory-manager/Chart.yaml)
          APP=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' helm/twake-directory-manager/Chart.yaml)
          failed=0
          if [ "$PACKAGE" != "$VERSION" ]; then
            echo "::error::package.json says $PACKAGE, the tag says $VERSION"; failed=1
          fi
          if [ "$CHART" != "$VERSION" ]; then
            echo "::error::Chart.yaml version is $CHART, the tag says $VERSION"; failed=1
          fi
          if [ "$APP" != "$VERSION" ]; then
            echo "::error::Chart.yaml appVersion is $APP, the tag says $VERSION"; failed=1
          fi
          # The heading release-notes reads: `## v1.2.3` alone or followed by a space.
          if ! awk -v hdr="## v$VERSION" '
            index($0, hdr) == 1 && (length($0) == length(hdr) || substr($0, length(hdr) + 1, 1) == " ") { found = 1 }
            END { exit !found }
          ' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## v$VERSION'"; failed=1
          fi
          exit $failed

  # Build and push one image per architecture, in parallel, each on a native
  # runner: no QEMU emulation for arm64.
  docker:
    name: Build & Push Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [checks, preflight]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_GHCR }}
            ${{ env.IMAGE_DOCKER }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # One cache scope per architecture: the parallel builds must not
      # overwrite each other's cache.
      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ env.IMAGE_GHCR }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ${{ env.IMAGE_DOCKER }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  # Assemble the multi-arch manifests once both arch builds are pushed.
  docker-manifest:
    name: Create Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One manifest per registry carrying all its tags, both registries at
      # once. Each push is awaited on its own: a bare `wait` would hide a
      # failure.
      - name: Create and push multi-arch manifests
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          PIDS=()
          for IMAGE in "$IMAGE_GHCR" "$IMAGE_DOCKER"; do
            TAGS=()
            for TAG in "$VERSION" "$MAJOR_MINOR" "$MAJOR" "latest"; do
              TAGS+=(-t "${IMAGE}:${TAG}")
            done
            docker buildx imagetools create "${TAGS[@]}" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64" &
            PIDS+=($!)
          done
          for PID in "${PIDS[@]}"; do
            wait "$PID"
          done

  # Package the chart under the tag's version and push it as an OCI artifact.
  helm:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: docker-manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      # The chart's version is the one in git: preflight checked it against
      # the tag before anything was built.
      - name: Package chart
        run: helm package helm/twake-directory-manager --destination .

      - name: Login to GHCR (Helm registry)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY_GHCR }} --username ${{ github.actor }} --password-stdin

      - name: Push chart to OCI registry
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          helm push "twake-directory-manager-${VERSION}.tgz" oci://${{ env.REGISTRY_GHCR }}/linagora/charts

  release:
    name: Create GitHub Release
    needs: [docker-manifest, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## v/ {
              if (inSection) exit
              hdr = "## v" ver
              if (substr($0,1,length(hdr))==hdr && (length($0)==length(hdr) || substr($0,length(hdr)+1,1)==" ")) { inSection=1; next }
            }
            inSection { print }
          ' CHANGELOG.md > release-notes.md
          # preflight checked the section exists; an empty one is still a mistake.
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has nothing under '## v$VERSION'"; exit 1
          fi
          echo "----- release notes -----"; cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
