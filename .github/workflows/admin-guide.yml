name: Administrator's guide

# The PDF is built on demand (Actions → Administrator's guide → Run workflow)
# and whenever the guide changes, and kept as the run's artifact.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/admin-guide/**'
  pull_request:
    paths:
      - 'docs/admin-guide/**'

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the HTML, warnings as errors
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            -w /repo/docs/admin-guide sphinxdoc/sphinx-latexpdf \
            sphinx-build -W --keep-going -b html . _build/html

      - name: Build the PDF
        run: make -C docs/admin-guide pdf

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-guide
          path: docs/admin-guide/_build/latex/*.pdf
