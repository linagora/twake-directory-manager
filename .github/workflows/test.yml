name: Test

# Every gate of the project, in one place: run on pull requests and on main,
# and called by release.yml, so that a release cannot skip a check a pull
# request runs.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # The versions ldap-rest supports, since it is what serves the console.
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      # Neither reads the runtime: one version answers for all of them.
      - name: Lint
        if: matrix.node-version == '24.x'
        run: npm run lint

      - name: Check formatting
        if: matrix.node-version == '24.x'
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      # Coverage is measured once, with the thresholds of .c8rc.json: a
      # suite that stops covering what it covered fails the build.
      - name: Test
        if: matrix.node-version != '24.x'
        run: npm test

      - name: Test with coverage
        if: matrix.node-version == '24.x'
        run: npm run test:coverage

      # Kept when the thresholds fail too: that is when the report is read.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.node-version == '24.x' }}
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

      - name: Build
        run: npm run build

  # Known vulnerabilities in the two npm trees. SECURITY.md says how a finding
  # is handled.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Audit the console's dependencies
        run: npm audit --audit-level=high

      - name: Audit the e2e suite's dependencies
        run: npm audit --audit-level=high
        working-directory: e2e

  # The Playwright suite of e2e/ against the image built from this tree, behind the stack of
  # scripts/qa-environment/ (OpenLDAP + Dex).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build the image
        run: ../scripts/qa-environment/build.sh

      # The image is ldap-rest and its base image under the console, which has no runtime
      # dependency of its own: a CRITICAL vulnerability with a fix available fails the gate, and
      # so the release, before anything is published. SECURITY.md says how one is accepted.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: twake-directory-manager-qa
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: ./scripts/start.sh

      - name: Test
        run: npx playwright test

      - name: Logs of the stack
        if: failure()
        run: mkdir -p test-results && docker compose -p twake-directory-manager-e2e -f ../scripts/qa-environment/docker-compose.yaml logs --no-color > test-results/stack.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: ./scripts/stop.sh

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Lint and render the chart
        run: |
          set -- \
            --set ldap.url=ldap://ldap.example.org \
            --set ldap.bindDn=cn=admin,dc=example,dc=org \
            --set ldap.base=dc=example,dc=org \
            --set oidc.server=https://auth.example.org \
            --set secrets.ldapPassword=secret \
            --set secrets.oidcClientSecret=secret \
            --set ingress.enabled=true \
            --set ingress.hostname=directory.example.org
          helm lint helm/twake-directory-manager "$@"
          helm template test helm/twake-directory-manager "$@" > /dev/null
          helm template test helm/twake-directory-manager "$@" \
            --set secrets.extraEnv.DM_JAMES_WEBADMIN_TOKEN=secret \
            | grep -q 'DM_JAMES_WEBADMIN_TOKEN: "secret"'
          # A credential the ConfigMap already sets is refused, not shadowed.
          if helm template test helm/twake-directory-manager "$@" \
            --set extraEnv.FOO=a --set secrets.extraEnv.FOO=b > /dev/null 2>&1; then
            echo "secrets.extraEnv shadowed extraEnv.FOO" >&2
            exit 1
          fi
