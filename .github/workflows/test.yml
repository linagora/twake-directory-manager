name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The versions ldap-rest supports, since it is what serves the console.
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      # Neither reads the runtime: one version answers for all of them.
      - name: Lint
        if: matrix.node-version == '24.x'
        run: npm run lint

      - name: Check formatting
        if: matrix.node-version == '24.x'
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
