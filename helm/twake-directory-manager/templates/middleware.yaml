{{- if .Values.ingress.redirectRoot }}
# The image already sends / to /static/console/; this Middleware is for a
# console served under another path, which the image does not know.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "tdm.fullname" . }}-root
spec:
  redirectRegex:
    # Only the bare root: any other path is left alone, including /api and the
    # OIDC callback, which a broader rule would break.
    regex: "^https?://([^/]+)/?$"
    replacement: "https://${1}{{ .Values.ingress.consolePath }}"
    permanent: true
{{- end }}
