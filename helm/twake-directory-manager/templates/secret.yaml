{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tdm.fullname" . }}-env
type: Opaque
stringData:
  DM_LDAP_PWD: {{ required "secrets.ldapPassword is required: the console cannot bind to the directory without it" .Values.secrets.ldapPassword | quote }}
  DM_OIDC_CLIENT_SECRET: {{ required "secrets.oidcClientSecret is required: the console refuses to start without an authentication provider" .Values.secrets.oidcClientSecret | quote }}
  {{- if .Values.bcl.enabled }}
  {{- if eq .Values.bcl.backend "postgres" }}
  DM_STORAGE_POSTGRES_URL: {{ required "bcl.postgres.url is required with the postgres backend" .Values.bcl.postgres.url | quote }}
  {{- else if eq .Values.bcl.backend "valkey" }}
  DM_STORAGE_VALKEY_URL: {{ required "bcl.valkey.url is required with the valkey backend" .Values.bcl.valkey.url | quote }}
  {{- end }}
  {{- end }}
{{- end }}
