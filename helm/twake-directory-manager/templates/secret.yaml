{{- if .Values.secrets.existingSecret }}
{{- if .Values.secrets.extraEnv }}
{{- fail "secrets.extraEnv is not rendered with secrets.existingSecret: put those variables in that Secret" }}
{{- end }}
{{- else }}
{{- /* The pod reads the Secret after the ConfigMap, so a variable in both
       would silently take the Secret's value: DM_EXTRA_PLUGINS would lose
       the plugins the chart adds to it. */}}
{{- $configured := (include (print $.Template.BasePath "/configmap.yaml") . | fromYaml).data }}
{{- $reserved := list "DM_LDAP_PWD" "DM_OIDC_CLIENT_SECRET" "DM_STORAGE_POSTGRES_URL" "DM_STORAGE_VALKEY_URL" }}
{{- range $k, $v := .Values.secrets.extraEnv }}
{{- if or (hasKey $configured $k) (has $k $reserved) }}
{{- fail (printf "secrets.extraEnv.%s is already set by the chart or by extraEnv" $k) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tdm.fullname" . }}-env
type: Opaque
stringData:
  DM_LDAP_PWD: {{ required "secrets.ldapPassword is required: the console cannot bind to the directory without it" .Values.secrets.ldapPassword | quote }}
  DM_OIDC_CLIENT_SECRET: {{ required "secrets.oidcClientSecret is required: the console refuses to start without an authentication provider" .Values.secrets.oidcClientSecret | quote }}
  {{- if .Values.bcl.enabled }}
  {{- if eq .Values.bcl.backend "postgres" }}
  DM_STORAGE_POSTGRES_URL: {{ required "bcl.postgres.url is required with the postgres backend" .Values.bcl.postgres.url | quote }}
  {{- else if eq .Values.bcl.backend "valkey" }}
  DM_STORAGE_VALKEY_URL: {{ required "bcl.valkey.url is required with the valkey backend" .Values.bcl.valkey.url | quote }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := .Values.secrets.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
