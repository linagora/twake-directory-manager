apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tdm.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if include "tdm.bclVolume" . }}
  # The volume is ReadWriteOnce: the old pod must let go of it first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "tdm.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "tdm.fullname" . }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if include "tdm.bclVolume" . }}
      # The image runs as node (1000): the volume must be writable by it.
      securityContext:
        fsGroup: 1000
      {{- end }}
      {{- if or (include "tdm.bclVolume" .) .Values.extraVolumes }}
      volumes:
        {{- if include "tdm.bclVolume" . }}
        - name: bcl
          persistentVolumeClaim:
            claimName: {{ include "tdm.fullname" . }}-bcl
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: console
          image: {{ include "tdm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "tdm.fullname" . }}-env
            - secretRef:
                name: {{ include "tdm.secretName" . }}
          # With OIDC on, every path redirects an unauthenticated request to
          # the provider, and a 302 counts as success for the kubelet. These
          # probes say the process is listening, not that it can reach the
          # directory — the console surfaces that itself.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          {{- if or (include "tdm.bclVolume" .) .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if include "tdm.bclVolume" . }}
            - name: bcl
              mountPath: /var/lib/twake-directory-manager/bcl
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
