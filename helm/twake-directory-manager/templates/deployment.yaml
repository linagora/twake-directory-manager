apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tdm.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "tdm.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "tdm.fullname" . }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: console
          image: {{ include "tdm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "tdm.fullname" . }}-env
            - secretRef:
                name: {{ include "tdm.secretName" . }}
          # With OIDC on, every path redirects an unauthenticated request to
          # the provider, and a 302 counts as success for the kubelet. These
          # probes say the process is listening, not that it can reach the
          # directory — the console surfaces that itself.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
