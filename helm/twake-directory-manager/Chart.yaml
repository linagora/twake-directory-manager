apiVersion: v2
name: twake-directory-manager
description: |
  Administration console for an enterprise directory. The image is an ldap-rest
  serving its API under /api with the console's static files next to it, so
  one Deployment and one Ingress cover both.
type: application
# version and appVersion follow package.json: bumped with it in the release
# commit, and checked against the tag by the release workflow, which packages
# the chart as it is here.
version: 0.12.0
appVersion: "0.12.0"
home: https://github.com/linagora/twake-directory-manager
keywords:
  - ldap
  - directory
  - administration
  - twake
maintainers:
  - name: yadd
    url: https://github.com/linagora/twake-directory-manager
sources:
  - https://github.com/linagora/twake-directory-manager
  - https://github.com/linagora/ldap-rest
